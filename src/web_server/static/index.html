<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="本地资源">
<meta name="format-detection" content="telephone=no">
<!-- 静态资源的 ?v= 必须跟着 APP_VERSION 走（tests/test_web_server.py 会校验）。
     服务端给静态资源 1 天缓存，平板升级后不清缓存就会继续跑旧 app.js，
     看起来像「明明修了还是坏的」。 -->
<link rel="icon" href="/static/icon.svg?v=1.18.3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg?v=1.18.3">
<link rel="stylesheet" href="/static/style.css?v=1.18.3">
<title>本地资源</title>
</head>
<body>

<header id="topbar">
  <div class="bar-row">
    <!-- 详情页才有：安卓返回键能退，但 iOS 加到主屏后没有返回键，必须给个明确的退路 -->
    <button class="icon-btn back" id="back-btn" type="button" aria-label="返回上级" hidden></button>
    <div class="brand">
      <span class="brand-dot"></span>
      <span id="brand-title">本地资源</span>
      <span class="crumb" id="crumb"></span>
    </div>
    <button class="icon-btn" id="search-toggle" type="button" aria-label="搜索">搜索</button>
  </div>

  <nav class="tabs" id="tabs" hidden>
    <button type="button" data-tab="photo">写真</button>
    <button type="button" data-tab="audio">音频</button>
    <button type="button" data-tab="video">视频</button>
  </nav>

  <div id="search-wrap" hidden>
    <input id="search-input" type="search" placeholder="搜索作品或作者" enterkeyhint="search"
           autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
</header>

<main id="view"></main>

<div id="subtitle-line" hidden></div>

<section id="player" hidden aria-label="播放控制">
  <img class="p-cover" id="p-cover" alt="">
  <div class="p-main">
    <div class="p-title" id="p-title">未在播放</div>
    <div class="p-sub" id="p-sub"></div>
  </div>
  <div class="p-seek-row">
    <span class="p-time" id="p-pos">00:00</span>
    <input type="range" id="p-seek" min="0" max="1000" value="0" step="1" aria-label="播放进度">
    <span class="p-time" id="p-dur">--:--</span>
    <button type="button" class="p-speed" id="p-speed" aria-label="倍速">1.0×</button>
  </div>
  <div class="p-controls">
    <button type="button" id="p-prev" aria-label="上一首"></button>
    <button type="button" id="p-play" class="main-play" aria-label="播放/暂停"></button>
    <button type="button" id="p-next" aria-label="下一首"></button>
  </div>
</section>

<div id="video-overlay" hidden>
  <div class="v-top">
    <button type="button" class="v-close" id="v-close" aria-label="关闭"></button>
    <div class="v-title" id="v-title"></div>
    <!-- 手机上没法按 O/E，标记入口就在这里；数据与桌面端同一张表，标一次全剧通用 -->
    <button type="button" class="v-tag" id="v-tag" aria-label="片头片尾标记">标记</button>
  </div>
  <div class="v-mark" id="v-mark" hidden>
    <div class="v-mark-info" id="v-mark-info"></div>
    <button type="button" id="v-mark-op">从这里标片头</button>
    <button type="button" id="v-mark-ed">从这里标片尾</button>
    <button type="button" id="v-mark-clear" class="ghost">清除标记</button>
  </div>
  <!-- 跳片头/片尾后的小提示条，点一下能回看刚跳过的那段（对应电脑端的 B 键） -->
  <button type="button" class="v-hint" id="v-hint" hidden></button>
  <!-- 不用原生 controls：原生进度条每拖一格就提交一次 seek，长 GOP 片子
       每次要 200ms 上下（见 app.js 里的说明）。这里自绘一条，松手才 seek。 -->
  <video id="video" playsinline webkit-playsinline preload="metadata"></video>
  <div class="v-controls" id="v-controls">
    <button type="button" class="v-btn" id="v-play" aria-label="播放/暂停"></button>
    <span class="v-time" id="v-pos">00:00</span>
    <input type="range" id="v-seek" min="0" max="1000" step="1" value="0" aria-label="视频进度">
    <span class="v-time" id="v-dur">--:--</span>
    <!-- 下一集：懒得等片尾/片尾没标时用。最后一集压暗但仍可点（点了给提示） -->
    <button type="button" class="v-btn" id="v-next" aria-label="下一集"></button>
    <button type="button" class="v-btn" id="v-full" aria-label="全屏"></button>
  </div>
  <div class="v-note" id="v-note" hidden></div>
</div>

<div id="lightbox" hidden>
  <div class="lb-top">
    <span id="lb-count"></span>
    <span class="lb-actions">
      <button type="button" class="lb-orig" id="lb-orig">原图</button>
      <button type="button" class="v-close" id="lb-close" aria-label="关闭"></button>
    </span>
  </div>
  <!-- 两层轮换：翻页时一层推走、另一层推进来。单张 <img> 换 src 是做不出动画的 -->
  <div class="lb-stage" id="lb-stage">
    <div class="lb-layer" id="lb-layer-a"><img id="lb-img" alt="" decoding="async"></div>
    <div class="lb-layer" id="lb-layer-b"><img id="lb-img-b" alt="" decoding="async"></div>
  </div>
  <button type="button" class="lb-nav prev" id="lb-prev" aria-label="上一张"></button>
  <button type="button" class="lb-nav next" id="lb-next" aria-label="下一张"></button>
</div>

<div id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script src="/static/compat.js?v=1.18.3"></script>
<script src="/static/app.js?v=1.18.3"></script>
</body>
</html>
